name: Sync Upstream Master

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  # This adds a button to run it manually

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your Fork
        uses: actions/checkout@v4
        with:
          # This is the token the action uses to push to your repo
          token: ${{ secrets.GITHUB_TOKEN }}
          # Make sure to fetch all history
          fetch-depth: 0

      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/snipe/snipe-it.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Sync master Branch
        run: |
          git checkout master
          # This command makes your master branch an exact copy of the upstream one
          git reset --hard upstream/master
          git push origin master --force-with-lease